<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Online Metronome — Tabutility</title>
<meta name="description" content="Free online metronome. Set your BPM, tap tempo, choose time signature. Perfect for musicians and practice sessions."/>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-78VZWJ5B1W"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-78VZWJ5B1W');</script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}nav{background:#1e293b;border-bottom:1px solid #334155;padding:14px 24px;display:flex;align-items:center;gap:16px}nav a{color:#94a3b8;text-decoration:none;font-size:14px}nav a:hover{color:#f1f5f9}nav .brand{color:#38bdf8;font-weight:700;font-size:18px}.ad-banner{background:#1e293b;border-bottom:1px solid #334155;padding:8px;text-align:center}</style>
</head>
<body>
<nav><span class="brand">⚡ Tabutility</span><a href="https://tabutility.com">← All Tools</a></nav>
<div class="ad-banner"><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-7039091592734005" data-ad-slot="auto" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
<div id="root"></div>
<script type="text/babel">
//<![CDATA[
const { useState, useEffect, useRef } = React;

const TEMPOS = [
  {name:'Larghissimo',max:24},{name:'Largo',max:40},{name:'Larghetto',max:60},
  {name:'Adagio',max:66},{name:'Andante',max:76},{name:'Moderato',max:108},
  {name:'Allegretto',max:120},{name:'Allegro',max:156},{name:'Vivace',max:176},
  {name:'Presto',max:200},{name:'Prestissimo',max:300},
];

function getTempoName(bpm) {
  for (const t of TEMPOS) { if (bpm <= t.max) return t.name; }
  return 'Prestissimo';
}

function click(ctx, isAccent) {
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  o.frequency.value = isAccent ? 1200 : 900;
  g.gain.setValueAtTime(isAccent ? 0.6 : 0.35, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
  o.start(ctx.currentTime);
  o.stop(ctx.currentTime + 0.05);
}

export default function Metronome() {
  const [bpm, setBpm] = useState(120);
  const [playing, setPlaying] = useState(false);
  const [beat, setBeat] = useState(0);
  const [timeSig, setTimeSig] = useState(4);
  const [tapTimes, setTapTimes] = useState([]);
  const [pendulum, setPendulum] = useState(0); // -1 left, 1 right
  const audioRef = useRef(null);
  const intervalRef = useRef(null);
  const beatRef = useRef(0);
  const bpmRef = useRef(bpm);

  useEffect(() => { bpmRef.current = bpm; }, [bpm]);

  const getCtx = () => { if (!audioRef.current) audioRef.current = new AudioContext(); return audioRef.current; };

  useEffect(() => {
    if (playing) {
      const schedule = () => {
        const interval = 60000 / bpmRef.current;
        const isAccent = beatRef.current % timeSig === 0;
        try { click(getCtx(), isAccent); } catch(e) {}
        setBeat(beatRef.current % timeSig);
        setPendulum(p => p === 0 ? 1 : -p);
        beatRef.current++;
        intervalRef.current = setTimeout(schedule, interval);
      };
      schedule();
    } else {
      clearTimeout(intervalRef.current);
      beatRef.current = 0;
      setBeat(0);
      setPendulum(0);
    }
    return () => clearTimeout(intervalRef.current);
  }, [playing, timeSig]);

  const tap = () => {
    const now = Date.now();
    const newTaps = [...tapTimes, now].filter(t => now - t < 3000).slice(-8);
    setTapTimes(newTaps);
    if (newTaps.length >= 2) {
      const intervals = [];
      for (let i = 1; i < newTaps.length; i++) intervals.push(newTaps[i] - newTaps[i-1]);
      const avg = intervals.reduce((a,b)=>a+b,0)/intervals.length;
      const newBpm = Math.round(60000 / avg);
      if (newBpm >= 20 && newBpm <= 300) setBpm(newBpm);
    }
  };

  const tempoName = getTempoName(bpm);
  const pAngle = pendulum * 30;

  return (
    <div style={{maxWidth:520,margin:'40px auto',padding:'0 20px'}}>
      <h1 style={{textAlign:'center',fontSize:28,fontWeight:700,marginBottom:8}}>Online Metronome</h1>
      <p style={{textAlign:'center',color:'#94a3b8',marginBottom:32}}>BPM control · Tap tempo · Time signature · Accent on beat 1</p>

      <div style={{background:'#1e293b',borderRadius:20,padding:'32px 24px',textAlign:'center',border:'1px solid #334155',marginBottom:20}}>
        {/* Pendulum */}
        <div style={{height:180,display:'flex',justifyContent:'center',alignItems:'flex-start',marginBottom:24,position:'relative'}}>
          <div style={{width:4,height:160,background:'#334155',borderRadius:2,position:'relative',transformOrigin:'top center',transform:`rotate(${pAngle}deg)`,transition:playing?`transform ${60/bpm*0.45}s ease-in-out`:'none'}}>
            <div style={{width:28,height:28,borderRadius:'50%',background:beat===0&&playing?'#38bdf8':'#475569',position:'absolute',bottom:-14,left:'50%',transform:'translateX(-50%)',boxShadow:beat===0&&playing?'0 0 20px #38bdf8':'none',transition:'background 0.05s,box-shadow 0.05s'}}/>
          </div>
        </div>

        {/* Beat indicators */}
        <div style={{display:'flex',gap:8,justifyContent:'center',marginBottom:24}}>
          {Array.from({length:timeSig},(_,i) => (
            <div key={i} style={{width:20,height:20,borderRadius:'50%',background:playing&&beat===i?(i===0?'#38bdf8':'#22c55e'):'#334155',transition:'background 0.05s',boxShadow:playing&&beat===i?`0 0 12px ${i===0?'#38bdf8':'#22c55e'}`:'none'}}/>
          ))}
        </div>

        {/* BPM display */}
        <div style={{marginBottom:24}}>
          <div style={{fontFamily:'monospace',fontSize:80,fontWeight:300,color:'#f1f5f9',lineHeight:1}}>{bpm}</div>
          <div style={{fontSize:16,color:'#94a3b8',marginTop:4}}>{tempoName}</div>
        </div>

        {/* BPM slider */}
        <input type="range" min="20" max="300" value={bpm} onChange={e=>setBpm(parseInt(e.target.value))}
          style={{width:'100%',marginBottom:16,accentColor:'#38bdf8'}}/>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'#475569',marginBottom:20}}>
          <span>20 BPM</span><span>300 BPM</span>
        </div>

        {/* +/- buttons */}
        <div style={{display:'flex',gap:8,justifyContent:'center',marginBottom:20,flexWrap:'wrap'}}>
          {[-10,-5,-1,'+1','+5','+10'].map(d => (
            <button key={d} onClick={() => setBpm(b => Math.min(300,Math.max(20,b+(typeof d==='number'?d:parseInt(d)))))}
              style={{background:'#334155',color:'#f1f5f9',border:'none',borderRadius:8,padding:'8px 14px',fontSize:14,fontWeight:600,cursor:'pointer'}}>{d}</button>
          ))}
        </div>

        <div style={{display:'flex',gap:12,justifyContent:'center',flexWrap:'wrap',marginBottom:16}}>
          <button onClick={() => setPlaying(p=>!p)}
            style={{background:playing?'#ef4444':'#22c55e',color:'#fff',border:'none',borderRadius:12,padding:'14px 40px',fontSize:18,fontWeight:700,cursor:'pointer'}}>
            {playing ? '⏹ Stop' : '▶ Start'}
          </button>
          <button onClick={tap} style={{background:'#334155',color:'#f1f5f9',border:'none',borderRadius:12,padding:'14px 28px',fontSize:18,fontWeight:700,cursor:'pointer'}}>Tap</button>
        </div>

        {/* Time signature */}
        <div style={{display:'flex',gap:8,justifyContent:'center',alignItems:'center'}}>
          <span style={{fontSize:14,color:'#64748b'}}>Time signature:</span>
          {[2,3,4,5,6,7,8].map(n => (
            <button key={n} onClick={() => { setTimeSig(n); beatRef.current=0; setBeat(0); }}
              style={{background:timeSig===n?'#38bdf8':'#334155',color:timeSig===n?'#0f172a':'#94a3b8',border:'none',borderRadius:8,padding:'6px 12px',fontSize:14,fontWeight:600,cursor:'pointer'}}>{n}/4</button>
          ))}
        </div>
      </div>

      <div style={{background:'#1e293b',borderRadius:16,padding:16,border:'1px solid #334155'}}>
        <h2 style={{fontSize:15,fontWeight:600,marginBottom:10}}>Common Tempos</h2>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {[{n:'Slow practice',b:60},{n:'Andante',b:76},{n:'Moderato',b:96},{n:'Allegro',b:132},{n:'Vivace',b:168},{n:'Presto',b:188}].map(t => (
            <button key={t.b} onClick={()=>setBpm(t.b)} style={{background:'#0f172a',color:'#94a3b8',border:'1px solid #334155',borderRadius:8,padding:'7px 12px',fontSize:13,cursor:'pointer'}}>
              {t.n} <span style={{color:'#38bdf8',fontWeight:700}}>{t.b}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Metronome />);
//]]>
</script>
</body>
</html>
